services:
  nas-project-cloud:
    # :latest is rebuilt on every push to main. Pin a release tag (for example :0.3.1) for a repeatable install.
    image: ghcr.io/jonathanbeck1/nas-project-cloud:latest
    container_name: nas-project-cloud
    restart: unless-stopped
    # PID 1 in the image is npm, which neither forwards signals nor reaps ffmpeg/pdftoppm children.
    init: true
    # A hostile or oversized image, video, or PDF gets this container killed, not the NAS. Raise to 4g for very large source images.
    mem_limit: 2g
    # The app runs as UID 1001 on an unprivileged port and needs no capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    environment:
      NAS_CLOUD_STORAGE_ROOT: /mnt/nas-cloud
      NAS_CLOUD_DB_PATH: /data/nas-cloud.sqlite
      NAS_CLOUD_PUBLIC_BASE_PATH: /files
      NAS_CLOUD_MAX_UPLOAD_BYTES: "2147483648"
      # Generate previews in-process. Set to "off" to drive previews from cron instead.
      NAS_CLOUD_PREVIEW_SCHEDULER: "on"
    volumes:
      - /mnt/OfficeNAS/nas-project-cloud/files:/mnt/nas-cloud
      - /mnt/OfficeNAS/nas-project-cloud/appdata:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
